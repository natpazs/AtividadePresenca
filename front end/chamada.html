<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada - Presenças e Faltas</title>
  <style>
    :root {
      --marinho: #0f172a;
      --azul-accent: #2563eb;
      --fundo: #eef2f7;
      --texto-suave: #64748b;
      --card-bg: #ffffff;
      --surface: #f8fafc;
      --border: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body.dashboard-body {
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.08), transparent 20%),
                  var(--fundo);
      min-height: 100vh;
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--marinho);
      line-height: 1.6;
    }

    .calendar-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 5%;
      min-height: calc(100vh - 96px);
    }

    .chamada-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .chamada-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .chamada-title h1 {
      margin: 0;
      font-size: 2rem;
    }

    .chamada-title p {
      margin: 0.75rem 0 0;
      color: var(--texto-suave);
    }

    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eef2ff;
      color: #1d4ed8;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .chamada-back {
      color: var(--marinho);
      text-decoration: none;
      font-weight: 600;
    }

    .chamada-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .chamada-actions button {
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-all-present {
      background: #def7ec;
      color: #047857;
    }

    .btn-all-absent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-save {
      background: var(--marinho);
      color: white;
    }

    .attendance-list {
      display: grid;
      gap: 16px;
    }

    .attendance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .student-name {
      font-weight: 600;
      color: var(--marinho);
    }

    .attendance-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .attendance-box {
      min-width: 110px;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .attendance-box.present {
      background: #ecfdf5;
      color: #065f46;
    }

    .attendance-box.absent {
      background: #fef2f2;
      color: #991b1b;
    }

    .attendance-box.active.present {
      background: #16a34a;
      color: white;
      border-color: #15803d;
    }

    .attendance-box.active.absent {
      background: #dc2626;
      color: white;
      border-color: #991b1b;
    }

    .history-card {
      padding: 20px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .history-card h3 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    .history-summary {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
        .btn-all-present,
    .btn-all-absent,
    .btn-save {

        padding: 12px 18px;
        border: none;
        border-radius: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-all-present {
        background: #dcfce7;
        color: #166534;
    }

    .btn-all-absent {
        background: #fee2e2;
        color: #991b1b;
    }

    .btn-save {
        background: #0f172a;
        color: white;
    }
    .mensagem-sucesso {

    position: fixed;

    top: 24px;
    right: 24px;

    background: linear-gradient(
        135deg,
        #16a34a,
        #15803d
    );

    color: white;

    padding: 16px 24px;

    border-radius: 16px;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 0.3px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.18),
        0 4px 10px rgba(22,163,74,0.25);

    z-index: 9999;

    animation:
        aparecerMensagem 0.35s ease,
        sumirMensagem 0.35s ease 2.7s forwards;

    backdrop-filter: blur(6px);

    border: 1px solid rgba(255,255,255,0.18);
}

    @keyframes aparecerMensagem {

        from {
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }

    @keyframes sumirMensagem {

        from {
            opacity: 1;
            transform: translateY(0);
        }

        to {
            opacity: 0;
            transform: translateY(-10px);
        }

    }

    @media (max-width: 760px) {
      .calendar-container {
        min-height: auto;
        padding: 1.5rem;
      }

      .chamada-card {
        padding: 24px;
      }
    }
    .chamada-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
}


  </style>
</head>
<body class="dashboard-body">
  <main class="calendar-container">
    <div id="chamada-root"></div>
  </main>
  <script type="module" src="./Chamada.js"></script>
</body>
</html>
