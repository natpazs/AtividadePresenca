<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Central de Aulas - Lycée Académique</title>
  <style>
    :root {
      --marinho: #0f172a;
      --azul-accent: #2563eb;
      --fundo: #eef2f7;
      --texto-suave: #64748b;
      --card-bg: #ffffff;
      --surface: #f8fafc;
      --border: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body.dashboard-body {
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.08), transparent 20%),
                  var(--fundo);
      min-height: 100vh;
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--marinho);
      line-height: 1.6;
    }

    .header-elite {
      background: var(--marinho);
      color: white;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
    }

    .header-elite .user-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-elite .welcome {
      font-size: 0.9rem;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .header-elite h2 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .calendar-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 5%;
      min-height: calc(100vh - 96px);
    }

    .carousel-controls {
      width: 100%;
      max-width: 840px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .carousel-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .days-carousel {
      width: 100%;
      max-width: 740px;
    }

    .day-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 420px;
    }

    .day-card h3 {
      color: var(--marinho);
      font-size: 1.9rem;
      margin: 0;
      border-bottom: 2px solid rgba(37, 99, 235, 0.18);
      padding-bottom: 14px;
    }

    .lista-aulas {
      display: grid;
      gap: 18px;
    }

    .aula-item {
      background: var(--surface);
      padding: 22px 24px;
      border-radius: 18px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }

    .aula-item:hover {
      transform: translateY(-1px);
      background: #eff6ff;
      border-color: rgba(37, 99, 235, 0.18);
    }

    .aula-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      width: 100%;
    }

    .aula-time {
      color: var(--texto-suave);
      font-size: 0.95rem;
    }

    .aula-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--marinho);
    }

    .aula-arrow {
      color: var(--marinho);
      font-size: 1.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.08);
    }

    .nav-arrow {
      background: var(--marinho);
      color: white;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
    }

    .btn-sair{
      width: 5%;
      background-color: #ffffff; /* Cor principal de elite */
      color: #0f172a;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;

}

    .nav-arrow:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .nav-arrow:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    @media (max-width: 760px) {
      .header-elite {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem 1.5rem 2rem;
      }

      .calendar-container {
        min-height: auto;
        padding: 1.5rem;
      }

      .carousel-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .carousel-viewport {
        order: 3;
      }

      .nav-arrow {
        width: 48px;
        height: 48px;
        align-self: center;
      }

      .day-card {
        padding: 24px;
      }

    }
  </style>
</head>
<body class="dashboard-body">

  <header class="header-elite">
    <div class="user-info">
      <span class="welcome">Bem-vindo,</span>
      <h2 id="nome-professor">Prof. Caíque Cruz</h2>
    </div>
    <button type="button" id="btn-sair" class="btn-sair">Sair</button>
  </header>

  <main class="calendar-container">
  <div class="carousel-controls">
    <button class="nav-arrow" id="prevDay">❮</button>
    
    <div class="carousel-viewport">
      <div id="container-semana" class="days-carousel">
        </div>
    </div>

    <button class="nav-arrow" id="nextDay">❯</button>
  </div>
</main>

  <script type="module" src="./Aulas.js"></script>
</body>
</html>
